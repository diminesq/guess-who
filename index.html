<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guess Who ?!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ECRAN LOBBY -->
  <div id="lobbyScreen" class="screen active">
    <div class="header-wrap">
      <h1 class="title-badge">Guess Who ?!</h1>
    </div>

    <div class="lobby-card">
      <div class="form-row">
        <div class="inputs-col">
          <div class="field-box">
            <label class="field-label" for="playerName">Nume:</label>
            <input type="text" id="playerName" class="field-input" placeholder="ex: Rareș" autocomplete="off" />
          </div>

          <div class="field-box">
            <label class="field-label" for="gameCode">Cod:</label>
            <input type="text" id="gameCode" class="field-input" placeholder="0000" maxlength="4" autocomplete="off" />
          </div>
        </div>

        <div class="select-col">
          <div class="select-wrap">
            <select id="categorySelect" class="select-styled">
              <option value="" disabled selected>Alege Categoria</option>
              <optgroup label="România">
                <option value="singers-ro">Cântăreți — România</option>
                <option value="trapperi-ro">Trapperi — România</option>
                <option value="youtuberi-ro">Youtuberi — România</option>
                <option value="actori-ro">Actori — România</option>
                <option value="mix-ro">Mix — România</option>
              </optgroup>
              <optgroup label="Internațional">
                <option value="singers-intl">Cântăreți — Internațional</option>
                <option value="trapperi-intl">Trapperi — Internațional</option>
                <option value="youtuberi-intl">Youtuberi — Internațional</option>
                <option value="actori-intl">Actori — Internațional</option>
                <option value="mix-intl">Mix — Internațional</option>
              </optgroup>
              <optgroup label="Mix Global">
                <option value="mix-all">Mix Total (Toți cei 160)</option>
              </optgroup>
            </select>
            <span class="select-arrow">↓</span>
          </div>
        </div>
      </div>

      <!-- BUTOANELE PLAY & INVITE -->
      <div class="actions-row">
        <button id="playBtn" class="btn-play">Play</button>
        <button id="inviteBtn" class="btn-invite">
          <span>Invite</span>
          <svg class="link-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ECRAN JOC -->
  <div id="gameScreen" class="screen">
    <div class="game-nav">
      <button id="backBtn" class="nav-btn">← Lobby</button>
      <div id="targetStatus" class="status-badge">👉 <b>Pasul 1:</b> Alege-ți cartonașul secret dând click pe el!</div>

      <div id="myCardContainer" class="my-card-display" style="display: none;">
        <img id="myCardImg" src="" alt="Personaj secret" />
        <div>
          <span style="font-size: 9px; font-weight: 800; color: #555;">PERSONAJUL TĂU:</span><br>
          <span id="myCardName" style="font-size: 13px; font-weight: 900; color: #000;">-</span>
        </div>
      </div>
    </div>

    <!-- GRILA CU CELE 28 DE CARTONAȘE (4 rânduri x 7 coloane) -->
    <div id="grid" class="board-grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
